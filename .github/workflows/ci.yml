name: CloudRAG CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Automated Tests
        env:
          POSTGRES_PASSWORD: ci-test-password-not-a-secret
        run: python -m pytest -v

      - name: Build Docker Image
        run: docker build -f backend/Dockerfile -t cloudrag-api:ci .

      - name: Verify Python Dependency Versions
        run: |
          docker run --rm cloudrag-api:ci python -m pip show msgpack setuptools urllib3
          docker run --rm cloudrag-api:ci python -m pip check

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloudrag-api:ci
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          scanners: vuln

      - name: CI Summary
        if: success()
        run: echo "All tests passed and the Docker image passed the vulnerability scan."