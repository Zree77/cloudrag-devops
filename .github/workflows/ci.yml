name: CloudRAG CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Automated Tests
        env:
          POSTGRES_PASSWORD: ci-test-password-not-a-secret
        run: python -m pytest -v

      - name: Build Docker Image
        run: docker build -f backend/Dockerfile -t cloudrag-api:ci .

      - name: Verify Python Dependency Versions
        run: |
          docker run --rm cloudrag-api:ci python -m pip show msgpack setuptools urllib3
          docker run --rm cloudrag-api:ci python -m pip check

      - name: Diagnose Trivy Package Detection
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloudrag-api:ci
          format: json
          output: trivy-report.json
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Inspect Trivy Report
        if: always()
        run: |
          python - <<'PY'
          import json
          import os

          path = "trivy-report.json"

          if not os.path.exists(path):
              print("Trivy report was not generated.")
              raise SystemExit(0)

          with open(path, encoding="utf-8") as f:
              report = json.load(f)

          print("=== Report Metadata ===")
          print("Schema version:", report.get("SchemaVersion"))
          print("Artifact name:", report.get("ArtifactName"))
          print("Artifact type:", report.get("ArtifactType"))

          print("\n=== Python Package Findings ===")

          for result in report.get("Results", []):
              print(
                  "\nTarget:",
                  result.get("Target"),
                  "| Type:",
                  result.get("Type"),
              )

              for vuln in result.get("Vulnerabilities") or []:
                  print({
                      "package": vuln.get("PkgName"),
                      "installed": vuln.get("InstalledVersion"),
                      "fixed": vuln.get("FixedVersion"),
                      "id": vuln.get("VulnerabilityID"),
                      "primary_url": vuln.get("PrimaryURL"),
                  })

          print("\n=== Package Metadata ===")

          for result in report.get("Results", []):
              for package in result.get("Packages") or []:
                  name = package.get("Name", "")
                  if name.lower() in {
                      "msgpack",
                      "setuptools",
                      "urllib3",
                  }:
                      print({
                          "name": name,
                          "version": package.get("Version"),
                          "path": package.get("FilePath"),
                      })
          PY

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloudrag-api:ci
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: CI Summary
        if: success()
        run: echo "All tests passed and the Docker image passed the vulnerability scan."